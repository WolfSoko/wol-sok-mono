<mat-card appearance="outlined" class="form">
  <mat-card-header>
    <mat-card-title>Live chat</mat-card-title>
    <mat-card-subtitle>Share your thoughts...</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content class="content">
    <rap-chat-message-form
      [minMessageLength]="minLength()"
      [maxMessageLength]="maxLength()"
      (messageAdded)="addChatMessage($event)"
    ></rap-chat-message-form>
    @if (postFailed()) {
      <p class="error" role="alert" data-testid="chat-error">
        Your message could not be posted. Please try again.
      </p>
    }
  </mat-card-content>
</mat-card>
<mat-card appearance="outlined" class="notes">
  <mat-card-header>
    <mat-card-title>Messages</mat-card-title>
    @if (chatMessages(); as messages) {
      <mat-card-subtitle>
        {{ messages.length }}
        {{ messages.length === 1 ? "message" : "messages" }}
      </mat-card-subtitle>
    }
  </mat-card-header>
  <mat-card-content class="content">
    <rap-messages-list [messages]="chatMessages()"></rap-messages-list>
  </mat-card-content>
</mat-card>
