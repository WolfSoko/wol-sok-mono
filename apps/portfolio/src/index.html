    <!-- The stored theme, before the first paint (ThemeService keeps it). -->
    <script>
      try {
        var t = localStorage.getItem("wolsok.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        } else {
          t = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", t === "dark" ? "#0b0f14" : "#f6f8fb");
      } catch (e) {}
    </script>
