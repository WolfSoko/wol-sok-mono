<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- SeoService sets each page's title, description, canonical and Open Graph tags when it is prerendered. -->
    <title>wolsok.de</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Wolfram Sokollek" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f6f8fb"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0b0f14"
    />
    <meta name="google-adsense-account" content="ca-pub-6346271540341424" />
    <meta property="og:site_name" content="wolsok.de" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- The stored theme, before the first paint (ThemeService keeps it). -->
    <script>
      try {
        var t = localStorage.getItem("wolsok.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
          var c = t === "dark" ? "#0b0f14" : "#f6f8fb";
          document
            .querySelectorAll('meta[name="theme-color"]')
            .forEach(function (m) {
              m.content = c;
            });
        }
      } catch (e) {}
    </script>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6346271540341424"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <wolsok-root></wolsok-root>
  </body>
</html>
