<header>
  <a routerLink="/" class="logo" [attr.aria-label]="t().nav.home">
    wol<span>sok</span>
  </a>
  <nav class="tools" [attr.aria-label]="t().nav.site">
    <a routerLink="/career" routerLinkActive="active" class="career">{{
      t().nav.career
    }}</a>
    <a href="https://github.com/WolfSoko" class="github">{{
      t().nav.github
    }}</a>
    <mat-button-toggle-group
      class="switch"
      hideSingleSelectionIndicator
      [attr.aria-label]="t().nav.language"
      [value]="i18n.language()"
      (change)="i18n.setLanguage($event.value)"
    >
      @for (language of languages; track language.id) {
        <mat-button-toggle
          [value]="language.id"
          [attr.lang]="language.id"
          [attr.title]="language.name"
          >{{ language.id.toUpperCase() }}</mat-button-toggle
        >
      }
    </mat-button-toggle-group>
    <button
      type="button"
      matIconButton
      class="theme"
      [attr.aria-label]="t().nav.theme[theme.choice()]"
      [title]="t().nav.theme[theme.choice()]"
      (click)="theme.cycle()"
    >
      @switch (theme.choice()) {
        @case ("light") {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" />
            <path
              d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"
            />
          </svg>
        }
        @case ("dark") {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
          </svg>
        }
        @default {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5" />
            <path d="M12 3.5v17A8.5 8.5 0 0 0 12 3.5Z" fill="currentColor" />
          </svg>
        }
      }
    </button>
  </nav>
</header>
<main>
  <router-outlet />
</main>
<footer>
  <span>© {{ year }} Wolfram Sokollek</span>
  <a routerLink="/privacy">{{ t().footer.privacy }}</a>
  <a href="https://github.com/WolfSoko/wol-sok-mono">{{ t().footer.source }}</a>
</footer>
