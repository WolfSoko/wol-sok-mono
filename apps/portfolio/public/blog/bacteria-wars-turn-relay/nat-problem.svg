<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img">
  <title>Why NATs drop the first packet</title>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#e9dfcc" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#15803d" />
    </marker>
  </defs>
  <rect width="960" height="520" fill="#fdf8ef" />
  <rect width="960" height="520" fill="url(#dots)" />
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1e293b">
    <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#1e293b">Why the first packet never arrives</text>
    <text x="105" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">private</text>
    <text x="855" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">private</text>
    <rect x="30" y="140" width="150" height="110" rx="14" fill="#fff" stroke="#1e293b" stroke-width="2.5" />
    <text x="105.0" y="191.0" text-anchor="middle" font-size="20" font-weight="800">Phone A</text>
    <text x="105.0" y="215.0" text-anchor="middle" font-size="15" fill="#64748b">10.23.4.5</text>
    <rect x="240" y="130" width="180" height="130" rx="14" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5" />
    <text x="330.0" y="191.0" text-anchor="middle" font-size="20" font-weight="800">NAT A</text>
    <text x="330.0" y="215.0" text-anchor="middle" font-size="15" fill="#64748b">public 203.0.113.7</text>
    <rect x="540" y="130" width="180" height="130" rx="14" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5" />
    <text x="630.0" y="191.0" text-anchor="middle" font-size="20" font-weight="800">NAT B</text>
    <text x="630.0" y="215.0" text-anchor="middle" font-size="15" fill="#64748b">public 198.51.100.9</text>
    <rect x="780" y="140" width="150" height="110" rx="14" fill="#fff" stroke="#1e293b" stroke-width="2.5" />
    <text x="855.0" y="191.0" text-anchor="middle" font-size="20" font-weight="800">Phone B</text>
    <text x="855.0" y="215.0" text-anchor="middle" font-size="15" fill="#64748b">192.168.1.20</text>
    <path d="M180 175 H236" stroke="#15803d" stroke-width="3" fill="none" marker-end="url(#arrow-green)" />
    <text x="208" y="166" text-anchor="middle" font-size="15" font-weight="600" fill="#15803d">out</text>
    <path d="M780 225 H724" stroke="#6d28d9" stroke-width="3" fill="none" marker-end="url(#arrow)" />
    <path d="M540 225 H430" stroke="#dc2626" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow-red)" />
    <text x="480" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">B sends to A:</text>
    <text x="480" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">203.0.113.7:51234</text>
    <path d="M480 124 V215" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 4" fill="none" />
    <text x="437" y="236" text-anchor="middle" font-size="30" font-weight="900" fill="#dc2626">✗</text>
    <rect x="220" y="300" width="220" height="100" rx="14" fill="#fff" stroke="#1e293b" stroke-width="2.5" />
    <text x="330.0" y="357.0" text-anchor="middle" font-size="20" font-weight="800"></text>
    <text x="330" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">NAT A remembers</text>
    <text x="330" y="352" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">10.23.4.5:5000</text>
    <text x="330" y="376" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">→ :51234, for STUN only</text>
    <rect x="500" y="300" width="430" height="100" rx="14" fill="#fff" stroke="#1e293b" stroke-width="2.5" />
    <text x="715.0" y="357.0" text-anchor="middle" font-size="20" font-weight="800"></text>
    <text x="715" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Symmetric NAT (mobile networks)</text>
    <text x="715" y="352" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">to STUN    → port 51234</text>
    <text x="715" y="376" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">to Phone B → port 60871 (new!)</text>
    <text x="480" y="455" text-anchor="middle" font-size="18" font-weight="600" fill="#1e293b">Answers to packets that went out get in. Everything else is dropped.</text>
    <text x="480" y="485" text-anchor="middle" font-size="15" font-weight="500" fill="#64748b">A symmetric NAT gives every destination its own port, so the address from STUN is the wrong one.</text>
  </g>
</svg>
