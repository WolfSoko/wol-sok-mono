<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img">
  <title>ICE candidates: host, server-reflexive and relay</title>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#e9dfcc" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#15803d" />
    </marker>
  </defs>
  <rect width="960" height="540" fill="#fdf8ef" />
  <rect width="960" height="540" fill="url(#dots)" />
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1e293b">
    <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="800" fill="#1e293b">ICE gathers candidates and tries the cheapest first</text>
    <rect x="40" y="100" width="170" height="360" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2.5" />
    <text x="125.0" y="287.0" text-anchor="middle" font-size="20" font-weight="800"></text>
    <text x="125" y="130" text-anchor="middle" font-size="20" font-weight="800" fill="#1e293b">Device A</text>
    <rect x="750" y="100" width="170" height="360" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5" />
    <text x="835.0" y="287.0" text-anchor="middle" font-size="20" font-weight="800"></text>
    <text x="835" y="130" text-anchor="middle" font-size="20" font-weight="800" fill="#1e293b">Device B</text>
    <rect x="58" y="145" width="134" height="62" rx="10" fill="#fff" stroke="#15803d" stroke-width="2.5" />
    <text x="125" y="171" text-anchor="middle" font-size="18" font-weight="800" fill="#15803d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">host</text>
    <text x="125" y="193" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">abc1….local</text>
    <rect x="768" y="145" width="134" height="62" rx="10" fill="#fff" stroke="#15803d" stroke-width="2.5" />
    <text x="835" y="171" text-anchor="middle" font-size="18" font-weight="800" fill="#15803d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">host</text>
    <text x="835" y="193" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">f00d….local</text>
    <path d="M196 175 H762" stroke="#15803d" stroke-width="3.5" fill="none" stroke-dasharray="10 7" marker-end="url(#arrow)" marker-start="url(#arrow)" />
    <circle cx="300" cy="153" r="15" fill="#15803d" />
    <text x="300" y="159" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">1</text>
    <text x="480" y="159" text-anchor="middle" font-size="15" font-weight="600" fill="#15803d">same network, mDNS works</text>
    <rect x="58" y="255" width="134" height="62" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2.5" />
    <text x="125" y="281" text-anchor="middle" font-size="18" font-weight="800" fill="#2563eb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">srflx</text>
    <text x="125" y="303" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">203.0.113.7</text>
    <rect x="768" y="255" width="134" height="62" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2.5" />
    <text x="835" y="281" text-anchor="middle" font-size="18" font-weight="800" fill="#2563eb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">srflx</text>
    <text x="835" y="303" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">198.51.100.9</text>
    <path d="M196 285 H762" stroke="#2563eb" stroke-width="3.5" fill="none" stroke-dasharray="10 7" marker-end="url(#arrow)" marker-start="url(#arrow)" />
    <circle cx="300" cy="263" r="15" fill="#2563eb" />
    <text x="300" y="269" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">2</text>
    <text x="480" y="269" text-anchor="middle" font-size="15" font-weight="600" fill="#2563eb">hole punching through both NATs</text>
    <rect x="58" y="365" width="134" height="62" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2.5" />
    <text x="125" y="391" text-anchor="middle" font-size="18" font-weight="800" fill="#ea580c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">relay</text>
    <text x="125" y="413" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">TURN allocation</text>
    <rect x="768" y="365" width="134" height="62" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2.5" />
    <text x="835" y="391" text-anchor="middle" font-size="18" font-weight="800" fill="#ea580c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">relay</text>
    <text x="835" y="413" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">TURN allocation</text>
    <rect x="410" y="361" width="140" height="68" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5" />
    <text x="480.0" y="391.0" text-anchor="middle" font-size="18" font-weight="800">TURN</text>
    <text x="480.0" y="415.0" text-anchor="middle" font-size="15" fill="#64748b">Cloudflare</text>
    <path d="M196 395 H404" stroke="#ea580c" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />
    <path d="M556 395 H762" stroke="#ea580c" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />
    <circle cx="300" cy="373" r="15" fill="#ea580c" />
    <text x="300" y="379" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">3</text>
    <text x="300" y="379" text-anchor="middle" font-size="15" font-weight="600" fill="#ea580c"></text>
    <text x="480" y="455" text-anchor="middle" font-size="15" font-weight="600" fill="#ea580c">always works · costs bandwidth</text>
    <text x="480" y="500" text-anchor="middle" font-size="17" font-weight="600" fill="#1e293b">The relay pair has the lowest priority: direct paths stay direct.</text>
    <text x="480" y="526" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">host: one network · srflx: home routers · relay: mobile data, isolated Wi-Fi</text>
  </g>
</svg>
