<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Pace-Trainer">
  <!--
    Pace-Trainer logo: an interval ring (orange = Sprint, blue = Erholung)
    around a bolt. Master file for all icons; regenerate them with
    `npx nx run pacetrainer:icons`.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17305e"/>
      <stop offset="1" stop-color="#0a1530"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#2f6fe4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2f6fe4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe6ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <g transform="rotate(-90 256 256)" fill="none" stroke-width="40" stroke-linecap="round">
    <circle cx="256" cy="256" r="176" pathLength="360" stroke="#8fb5ff" stroke-dasharray="54 66" stroke-dashoffset="-44"/>
    <circle cx="256" cy="256" r="176" pathLength="360" stroke="#ff9a2e" stroke-dasharray="22 98"/>
  </g>
  <path d="M286 142 L190 290 H254 L226 370 L330 222 H266 Z" fill="url(#bolt)" stroke="url(#bolt)" stroke-width="10" stroke-linejoin="round"/>
</svg>
