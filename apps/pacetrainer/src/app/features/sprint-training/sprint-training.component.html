@let state = run();
<section
  class="trainer"
  data-qa="sprint-training"
  [attr.data-tone]="tone()"
  [class.paused]="state.phase === 'paused'"
>
  <h2 class="eyebrow">Sprint Training</h2>

  <div class="stage" [class.setup-stage]="state.phase === 'ready'">
    @switch (state.phase) {
      @case ("ready") {
        <div class="setup">
          <pace-sprint-form></pace-sprint-form>
          <pace-sprint-training-overview></pace-sprint-training-overview>
        </div>
      }
      @case ("leadIn") {
        <pace-training-live-state
          [countdown]="countdown()"
          [phase]="state.phase"
        >
          <pace-countdown-circle
            [duration]="state.total"
            [timeLeft]="state.left"
          ></pace-countdown-circle>
        </pace-training-live-state>
      }
      @case ("finished") {
        <pace-zusammenfassung
          [zusammenfassung]="state.zusammenfassung"
        ></pace-zusammenfassung>
      }
      @default {
        <pace-training-live-state
          [countdown]="countdown()"
          [phase]="state.phase"
          [current]="state.current"
          [elapsed]="state.elapsed"
        >
          <pace-countdown-circle
            [duration]="state.current.duration"
            [timeLeft]="state.current.left"
          ></pace-countdown-circle>
        </pace-training-live-state>
      }
    }
  </div>

  <div class="actions">
    <button
      mat-flat-button
      class="primary-action"
      (click)="primaryAction()"
      [disabled]="state.phase === 'leadIn'"
      data-qa="toggle-training"
    >
      @switch (state.phase) {
        @case ("running") {
          Pausieren
        }
        @case ("paused") {
          Weiter
        }
        @case ("finished") {
          Neues Training
        }
        @default {
          Go Go Go
        }
      }
    </button>
    @if (
      state.phase === "leadIn" ||
      state.phase === "running" ||
      state.phase === "paused"
    ) {
      <button
        mat-stroked-button
        class="secondary-action"
        (click)="endTraining()"
        data-qa="stop-training"
      >
        Training beenden
      </button>
    }
  </div>
</section>
