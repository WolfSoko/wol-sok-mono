@let state = run();
<mat-card data-qa="sprint-training">
  <mat-card-header>
    <mat-card-title>Sprint Training</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @switch (state.phase) {
      @case ("ready") {
        <div class="configurator">
          <pace-sprint-form @myInsertRemoveTrigger></pace-sprint-form>
        </div>
      }
      @case ("leadIn") {
        <div class="runner">
          <pace-countdown-circle
            @myInsertRemoveTrigger
            [duration]="state.total"
            [timeLeft]="state.left"
          ></pace-countdown-circle>
          <pace-training-live-state
            [countdown]="countdown()"
            [phase]="state.phase"
          ></pace-training-live-state>
        </div>
      }
      @case ("finished") {
        <pace-run-summary [summary]="state.summary"></pace-run-summary>
      }
      @default {
        <div class="runner">
          <pace-countdown-circle
            [duration]="state.current.duration"
            [timeLeft]="state.current.left"
          ></pace-countdown-circle>
          <pace-training-live-state
            [countdown]="countdown()"
            [phase]="state.phase"
            [current]="state.current"
            [elapsed]="state.elapsed"
          ></pace-training-live-state>
        </div>
      }
    }
  </mat-card-content>
  <mat-card-actions class="ctas">
    <button
      mat-raised-button
      (click)="primaryAction()"
      [disabled]="state.phase === 'leadIn'"
      data-qa="toggle-training"
    >
      @switch (state.phase) {
        @case ("running") {
          Pausieren
        }
        @case ("paused") {
          Weiter
        }
        @case ("finished") {
          Neues Training
        }
        @default {
          Go Go Go
        }
      }
    </button>
    @if (
      state.phase === "leadIn" ||
      state.phase === "running" ||
      state.phase === "paused"
    ) {
      <button mat-raised-button (click)="endTraining()" data-qa="stop-training">
        Training beenden
      </button>
    }
  </mat-card-actions>
</mat-card>
<mat-card>
  <mat-card-content>
    <div class="overview">
      <pace-sprint-training-overview
        [open]="state.phase === 'ready'"
      ></pace-sprint-training-overview>
    </div>
  </mat-card-content>
</mat-card>
