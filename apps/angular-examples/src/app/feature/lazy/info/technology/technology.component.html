<div
  wsThanos
  #thanos="thanos"
  class="thanos-container"
  [wsThanosOptions]="{ crumble: crumble(), windDirection: windDirection() }"
  (wsThanosComplete)="nextSnap()"
>
  <mat-card
    appearance="raised"
    (click)="thanos.vaporize(false)"
    class="technologyCard"
    wsSharedUiElevateCard
  >
    <mat-card-header>
      <mat-card-title-group class="title-group">
        <mat-card-title>
          <a mat-button target="_blank" [href]="link">{{ title }}</a>
        </mat-card-title>
        <div class="tech-image" matCardImageXLarge>
          <img
            [fill]="true"
            priority="false"
            [ngSrc]="image"
            [class.light-theme-logo]="darkImage"
            alt="logo of {{ title }}"
            src=""
          />
          @if (darkImage) {
            <img
              [fill]="true"
              priority="false"
              [ngSrc]="darkImage"
              class="dark-theme-logo"
              alt="logo of {{ title }}"
              src=""
            />
          }
        </div>
      </mat-card-title-group>
    </mat-card-header>
  </mat-card>
</div>
