# Launch template of the Nx Cloud workers; .nx/ci-config.yaml says how many to start.
# Reference: https://nx.dev/docs/kb/launch-templates
launch-templates:
  wolsokmono-linux-extra-large:
    resource-class: 'docker_linux_amd64/extra_large'
    # Newest image Nx Cloud lists (https://nx.dev/docs/kb/launch-templates); the
    # install-node step below still installs the version from .nvmrc via nvm.
    image: 'ubuntu22.04-node24.14-v1'
    env:
      HUSKY: 0
      NODE_OPTIONS: '--max_old_space_size=4096'

    init-steps:
      - name: Checkout # using a reusable step
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/checkout/main.yaml'
        env:
          GIT_CHECKOUT_DEPTH: '50'
          GIT_FETCH_TAGS: 'true'

      - name: Install Node
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/install-node/main.yaml'

      - name: Install necessary binaries
        script: |

          echo "node version used: $(node -v)"

          # No compiler toolchain or X11 headers: install scripts are off below, and
          # `gl` (the only module that needed them) is denied in allowScripts anyway.
          # The three libraries are runtime deps of the Playwright browsers that
          # `playwright install --with-deps` misses on this image.
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libavif13 libgtk-4-1 libgraphene-1.0-0

          echo "Install a JVM for the Firestore emulator (bacteria-game-remote e2e)"
          sudo apt-get install -y --no-install-recommends openjdk-21-jre-headless

      - name: Restore Node Modules Cache
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/cache/main.yaml'
        inputs:
          key: 'package-lock.json'
          paths: |
            ~/workflows/workspace/node_modules/
            ~/.npm
          base-branch: 'main'

      # Own script instead of the install-node-modules step: that one runs npm ci,
      # which deletes the restored node_modules first, while npm install only
      # verifies the tree. Scripts stay off as on the runners.
      - name: Install Node Modules
        script: |
          npm install --ignore-scripts --no-audit --no-fund

      - name: Install Browsers (if needed)
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/install-browsers/main.yaml'
