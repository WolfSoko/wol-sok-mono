<ws-shared-ui-show-fps
  class="stats"
  [show]="showFps"
  [fps]="(fps$ | async) ?? 0"
></ws-shared-ui-show-fps>
<div #canvasContainer class="canvas-container">
  <canvas
    #webGLCanvas
    [width]="bufferWidth()"
    [height]="bufferHeight()"
    [style.width.px]="canvasWidth"
    [style.height.px]="canvasHeight"
    [class.waiting]="waiting()"
    (touchmove)="onTouchMove($event)"
    (mousemove)="onMouseMove($event)"
  >
  </canvas>
</div>
