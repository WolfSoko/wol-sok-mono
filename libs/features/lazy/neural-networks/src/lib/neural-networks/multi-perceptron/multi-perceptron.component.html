<div class="perceptron-container">
  <mat-card appearance="raised" class="data-card">
    <mat-card-header>
      <mat-card-subtitle>Data</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <feat-lazy-neural-networks-data-view
        [canvasWidth]="width"
        [canvasHeight]="height"
        [perceptron]="outputPerceptron"
        [points]="points"
        (dataViewClicked)="addPoint($event)"
        [showLinearDivider]="false"
      />
      <div>
        Learnrate: {{ learnRate }}, learned data points: {{ learnedDataPoints }}
      </div>
    </mat-card-content>
  </mat-card>
  <feat-lazy-neural-networks-brain-settings
    [perceptronLayers]="perceptronPerLayer"
  />
  <mat-card appearance="raised" class="inputLayer">
    <mat-card-header>
      <mat-card-subtitle>Input layer</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      @for (perceptron of inputPerceptron; track perceptron) {
        <feat-lazy-neural-networks-perceptron
          [perceptron]="perceptron"
          [canvasWidth]="200"
          [canvasHeight]="200"
        />
      }
    </mat-card-content>
  </mat-card>
  <mat-card appearance="raised">
    <mat-card-header>
      <mat-card-subtitle>Hidden layer</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      @for (perceptron of hiddenPerceptron; track perceptron) {
        <feat-lazy-neural-networks-perceptron
          [perceptron]="perceptron"
          [canvasWidth]="200"
          [canvasHeight]="200"
        />
      }
    </mat-card-content>
  </mat-card>
  <mat-card appearance="raised" class="outputLayer">
    <mat-card-header>
      <mat-card-subtitle>Output layer</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <feat-lazy-neural-networks-perceptron
        [perceptron]="outputPerceptron"
        [canvasWidth]="200"
        [canvasHeight]="200"
      />
    </mat-card-content>
  </mat-card>
</div>
