<form [formGroup]="form" class="configuration" data-qa="form">
  <mat-form-field appearance="outline">
    <mat-label>Gravity in AU³/M☉/yr²</mat-label>
    <input
      matInput
      data-qa="gConstant"
      type="number"
      step="1"
      formControlName="gravitationalConstant"
    />
    <mat-hint>Ours is 4π², which is {{ realGravity }}</mat-hint>
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Mass of sun in M☉</mat-label>
    <input
      matInput
      data-qa="massOfSun"
      type="number"
      step="0.1"
      formControlName="massOfSun"
    />
    <mat-hint>Ours weighs 1, the earth a third of a millionth</mat-hint>
  </mat-form-field>
  <div class="trail-length">
    <label for="simulation-speed-slider">
      Simulation speed:
      {{ simulationSpeed | number: "1.1-2" }}&times;
    </label>
    <mat-slider
      class="config-slider"
      [max]="maxSpeedExponent"
      [min]="minSpeedExponent"
      [step]="0.05"
    >
      <input
        id="simulation-speed-slider"
        matSliderThumb
        data-qa="simulationSpeed"
        [value]="speedExponent"
        (valueChange)="setSpeedExponent($event)"
      />
    </mat-slider>
  </div>
  <mat-slide-toggle data-qa="showTrail" formControlName="showTrail">
    Show trail
  </mat-slide-toggle>
  <div class="trail-length">
    <label for="trail-length-slider">
      Trail length: {{ form.controls.trailLength.value }}
    </label>
    <mat-slider
      class="config-slider"
      discrete="true"
      [max]="maxTrailLength"
      [min]="minTrailLength"
      [step]="10"
    >
      <input
        id="trail-length-slider"
        matSliderThumb
        data-qa="trailLength"
        formControlName="trailLength"
      />
    </mat-slider>
  </div>
</form>
