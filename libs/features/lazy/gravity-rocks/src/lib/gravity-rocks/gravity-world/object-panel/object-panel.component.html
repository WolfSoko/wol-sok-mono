<mat-card appearance="raised" class="object-panel" data-qa="object-panel">
  <div class="object-panel-header">
    <span class="object-panel-title" data-qa="object-panel-title">{{
      title()
    }}</span>
    <button
      mat-icon-button
      type="button"
      data-qa="cta-close-panel"
      aria-label="Close"
      (click)="close()"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <mat-card-content class="object-panel-content">
    @if (parentName()) {
      <div class="panel-slider">
        <label for="menu-distance-slider"
          >Distance from the {{ parentName() }}:
          {{ distance() | number: "1.3-3" }} AU</label
        >
        <mat-slider
          [max]="distanceRange().max"
          [min]="distanceRange().min"
          [step]="distanceStep()"
        >
          <input
            id="menu-distance-slider"
            matSliderThumb
            data-qa="menu-distance"
            [value]="distance()"
            (valueChange)="setDistance($event)"
          />
        </mat-slider>
      </div>
    }
    <div class="panel-slider">
      <label for="menu-mass-slider"
        >Mass: {{ mass() | number: "1.0-3" }} &times; Earth</label
      >
      <mat-slider [max]="maxMassExponent" [min]="minMassExponent" [step]="0.05">
        <input
          id="menu-mass-slider"
          matSliderThumb
          data-qa="menu-mass"
          [value]="massExponent()"
          (valueChange)="setMassExponent($event)"
        />
      </mat-slider>
    </div>
    <!-- a static object never moves, its speed is not a thing to change -->
    @if (!target().isStatic) {
      <div class="panel-slider">
        <label for="menu-speed-slider"
          >Speed: {{ speed() | number: "1.2-2" }} AU/year</label
        >
        <mat-slider [max]="maxSpeed" [min]="0" [step]="0.1">
          <input
            id="menu-speed-slider"
            matSliderThumb
            data-qa="menu-speed"
            [value]="speed()"
            (valueChange)="setSpeed($event)"
          />
        </mat-slider>
      </div>
    }

    <mat-divider />
    <h4 class="panel-subheader">Next {{ satelliteName() }}</h4>
    <div class="panel-slider">
      <label for="menu-orbit-slider"
        >Orbit: {{ orbit() | number: "1.3-3" }} AU</label
      >
      <mat-slider
        [max]="orbitRange().max"
        [min]="orbitRange().min"
        [step]="orbitStep()"
      >
        <input
          id="menu-orbit-slider"
          matSliderThumb
          data-qa="menu-orbit"
          [value]="orbit()"
          (valueChange)="setOrbitDistance($event)"
        />
      </mat-slider>
      @if (!held()) {
        <p class="panel-hint" data-qa="orbit-hint">
          Too light to keep a {{ satelliteName() }} out there - the
          {{ parentName() }} will take it. Raise the mass to hold one.
        </p>
      }
    </div>
    <button
      mat-stroked-button
      type="button"
      data-qa="cta-add-satellite"
      (click)="placeSatellite()"
    >
      <mat-icon>add_circle_outline</mat-icon>
      Add orbiting {{ satelliteName() }}
    </button>

    @if (target() !== sun()) {
      <mat-divider />
      <button
        mat-button
        type="button"
        color="warn"
        data-qa="cta-remove-target"
        (click)="removeTarget()"
      >
        <mat-icon>delete_forever</mat-icon>
        Remove
      </button>
    }
  </mat-card-content>
</mat-card>
