@let level = card();
<button
  type="button"
  class="level-card"
  [class.current]="current()"
  [class.locked]="level.lock !== null"
  [disabled]="level.lock !== null"
  [attr.aria-current]="current() ? 'true' : null"
  [style.--card-floor]="level.floor"
  [style.--card-edge]="level.edge"
  (click)="pick.emit(level.id)"
>
  <span class="card-top">
    <span class="number">{{ level.badge }}</span>
    @if (level.lock !== null) {
      <mat-icon class="lock">lock</mat-icon>
    }
  </span>
  <span class="title">{{ level.title }}</span>
  <span class="card-foot">
    @if (level.lock !== null) {
      <span class="lock-reason">{{ level.lock }}</span>
    } @else if (showMedals()) {
      @for (slot of level.medals; track slot.difficulty) {
        <feat-lazy-bac-game-medallion
          [tier]="slot.tier"
          [size]="22"
          [difficulty]="slot.difficulty"
        />
      }
    }
  </span>
</button>
