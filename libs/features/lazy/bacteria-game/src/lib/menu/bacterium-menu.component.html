<canvas #canvas class="cell" aria-hidden="true"></canvas>
@if (fallback()) {
  <div class="css-body" aria-hidden="true">
    @for (item of items(); track item.id) {
      @if (item.id !== "play") {
        <span
          class="css-lobe"
          [class.hot]="hot() === item.id"
          [style.left.%]="left(item.id)"
          [style.top.%]="top(item.id)"
          [style.--lobe]="anchors[item.id].r"
        ></span>
      }
    }
  </div>
}
<ul class="parts">
  @for (item of items(); track item.id) {
    <li
      class="part"
      [class.play]="item.id === 'play'"
      [class.online]="item.id === 'online'"
      [style.left.%]="left(item.id)"
      [style.top.%]="top(item.id)"
      [attr.data-part]="item.id"
    >
      @if (item.link; as link) {
        <a
          class="spot"
          [href]="link.url"
          [attr.target]="link.external ? '_blank' : null"
          [attr.rel]="link.external ? 'noopener' : null"
          (pointerenter)="hot.set(item.id)"
          (pointerleave)="hot.set(null)"
          (focus)="hot.set(item.id)"
          (blur)="hot.set(null)"
        >
          <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span class="label">{{ item.label | t }}</span>
        </a>
      } @else {
        <button
          type="button"
          class="spot"
          (click)="pick.emit(item.id)"
          (pointerenter)="hot.set(item.id)"
          (pointerleave)="hot.set(null)"
          (focus)="hot.set(item.id)"
          (blur)="hot.set(null)"
        >
          <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span class="label">{{ item.label | t }}</span>
          @if (item.countKey; as countKey) {
            <span class="count" aria-hidden="true">{{ item.count }}</span>
            <span class="cdk-visually-hidden">{{
              countKey | t: { count: item.count }
            }}</span>
          }
        </button>
      }
    </li>
  }
</ul>
