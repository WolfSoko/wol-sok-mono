<div
  class="base"
  [class.idle]="origin() === null"
  [style.transform]="baseTransform()"
  [style.width.px]="radius * 2"
  [style.height.px]="radius * 2"
>
  <div
    class="knob"
    [style.transform]="'translate(' + knob().x + 'px, ' + knob().y + 'px)'"
  ></div>
</div>
@if (origin() === null) {
  <span class="label">{{ name() }}</span>
}
