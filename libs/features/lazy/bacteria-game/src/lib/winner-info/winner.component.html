<h2 class="headline">{{ headline() }}</h2>
<p class="level-info">{{ level().name }}</p>
<div class="actions">
  <button mat-button type="button" (click)="action.emit('menu')">
    <mat-icon>home</mat-icon>
    Main menu
  </button>
  <button mat-stroked-button type="button" (click)="action.emit('again')">
    <mat-icon>replay</mat-icon>
    Play again
  </button>
  @if (upcoming(); as next) {
    <button
      mat-flat-button
      color="primary"
      type="button"
      (click)="action.emit('next')"
    >
      <mat-icon>skip_next</mat-icon>
      Next: {{ next.name }}
    </button>
  }
</div>
