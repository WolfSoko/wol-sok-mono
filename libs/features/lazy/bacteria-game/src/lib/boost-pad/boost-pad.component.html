<div class="pad">
  <span class="charge" [style.background]="chargeRing()">
    <button
      mat-fab
      type="button"
      class="boost-fab"
      [attr.aria-label]="'Boost ' + colony().name"
      [disabled]="!running() || colony().boosting || colony().boostCooldown > 0"
      (click)="boost.emit()"
    >
      <mat-icon>bolt</mat-icon>
      <span class="boost-state">{{ boostLabel(colony()) }}</span>
    </button>
  </span>
  <span class="pad-name">{{ colony().name }}</span>
  <span class="pad-stats"
    >{{ colony().bacterias }} · ⚡ {{ colony().energy }}%</span
  >
  <span class="colony-bar">
    <span
      class="colony-bar-fill"
      [style.width.%]="colony().share"
      [style.backgroundColor]="colony().css"
    ></span>
  </span>
</div>
