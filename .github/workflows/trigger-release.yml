name: Trigger Release

# Bumps the version, pushes the release commit and the tags, and then creates
# the GitHub release on the same runner, which starts deploy.yml.
on:
  workflow_call:
    secrets:
      PAT_TOKEN:
        required: true
      RELEASE_GH_TOKEN:
        required: true
      SENTRY_AUTH_TOKEN:
        required: true
      NX_CLOUD_ACCESS_TOKEN:
        required: true
  workflow_dispatch:

env:
  HUSKY: 0
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  trigger-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        name: 'Checkout branch'
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
          filter: tree:0

      - name: Install Deps
        uses: ./.github/actions/install-deps

      - name: Snapshot tags before versioning
        run: git tag --list | LC_ALL=C sort > "$RUNNER_TEMP/tags-before.txt"

      - name: trigger release
        run: |
          git config --local user.email "github-actions[bot]@users.no-reply.github.com"
          git config --local user.name "github-actions[bot]"
          npx nx release version
          # Leave the release commit as it is: the v* tag points at it, so amending
          # it would leave the tag on a commit that never reaches the branch, and
          # `git describe` on the branch stops finding new release tags. No
          # [skip ci] needed: ci-cd.yml already skips its jobs for
          # `chore(release):` commits.
          npx commit-and-tag-version

      - name: Push changes
        run: git push origin HEAD:${{ github.ref }}

      # Independent versioning tags every released project, so this run can create
      # several tags at once. No workflow runs on a tag push any more (the release
      # is created below), so they go out in one push.
      - name: Push tags
        id: push-tags
        run: |
          git tag --list | LC_ALL=C sort > "$RUNNER_TEMP/tags-after.txt"
          mapfile -t new_tags < <(comm -13 "$RUNNER_TEMP/tags-before.txt" "$RUNNER_TEMP/tags-after.txt")

          if [[ ${#new_tags[@]} -eq 0 ]]; then
            echo "No new tags were created, nothing to push."
            echo 'No new tags were created.' >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          release_tags=()
          for tag in "${new_tags[@]}"; do
            if [[ "$tag" == v[0-9]* ]]; then
              release_tags+=("$tag")
            fi
          done
          echo "New tags: ${new_tags[*]}"
          echo "Release tag: ${release_tags[*]:-none}"

          git push origin "${new_tags[@]}"

          echo "Pushed ${#new_tags[@]} new tag(s)." >> $GITHUB_STEP_SUMMARY
          echo "release_tag=${release_tags[*]: -1}" >> $GITHUB_OUTPUT

      # HEAD is the release commit the tag points at, so the apps are built here
      # instead of on a third runner started by the tag push.
      - name: Create release
        if: steps.push-tags.outputs.release_tag != ''
        uses: ./.github/actions/create-release
        with:
          tag: ${{ steps.push-tags.outputs.release_tag }}
          github-token: ${{ secrets.RELEASE_GH_TOKEN }}
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Create Issue on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh issue create \
            --title "bug(release): create release pipeline failed" \
            --body "GitHub [Trigger Release workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) failed" \
            --label "bug" \
            --assignee "${{ github.actor }}"
