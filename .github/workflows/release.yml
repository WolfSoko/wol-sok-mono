name: Release

# One pipeline per release: version bump, changelogs and tags, the GitHub
# release, then the deploy of everything that changed since the last deploy.
# ci-cd.yml calls it after a green run on main; run it by hand to release now.
# A failed build, release or deploy is retried with "Re-run failed jobs": the
# version job's output survives the rerun, the later jobs start again at the tag.
on:
  workflow_call:
    outputs:
      version:
        description: 'The released tag (v<version>)'
        value: ${{ jobs.version.outputs.version }}
  workflow_dispatch:

env:
  HUSKY: 0
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # One release at a time: the version bump commits to main.
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      version: ${{ steps.push.outputs.release_tag }}

    steps:
      # The commit CI just validated, not the branch tip, which may have moved on
      # by now. The PAT pushes the release commit to the protected main branch.
      - uses: actions/checkout@v7
        name: 'Checkout the validated commit'
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
          filter: tree:0

      # Release runs wait for each other but don't keep their order: when the
      # run of a newer commit released first, this checkout still holds the old
      # package versions, so versioning it again would re-create tags that
      # already exist. The newer run released this commit's changes too.
      - name: Stand down when the branch moved on
        id: branch
        env:
          BRANCH: ${{ github.ref }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          if tools/release/branch-moved-on.sh "$BRANCH" "$VALIDATED_SHA"; then
            echo "moved_on=true" >> "$GITHUB_OUTPUT"
          elif [[ $? -eq 1 ]]; then
            echo "moved_on=false" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

      - name: Install Deps
        if: steps.branch.outputs.moved_on == 'false'
        uses: $/.github/actions/install-deps

      - name: Version
        if: steps.branch.outputs.moved_on == 'false'
        run: |
          git config --local user.email "github-actions[bot]@users.no-reply.github.com"
          git config --local user.name "github-actions[bot]"
          # Only the packages whose build reads a file this release changes
          # (#3020): nx release alone counts every target's inputs, so a
          # lint-only commit bumped, and the npm leg published, every package.
          # The range is the release, as ci-cd.yml's trigger takes it: a
          # package's own tag can lag far behind, and a deletion or root
          # package.json change in that long range keeps Nx's verdict.
          # No pipe: the step's bash has no pipefail, so a failing selection
          # would read as an empty one. An empty --projects could mean every
          # package, so an empty list skips the call.
          selected=$(node tools/ci/release-affected.mjs --base="v$(node -p "require('./version.json').version")" --head=HEAD --target=build --projects='tag:published')
          packages=$(paste -sd, - <<< "$selected")
          if [[ -n "$packages" ]]; then
            npx nx release version --projects="$packages"
          else
            echo "No npm package to version."
          fi
          # Leave the release commit as it is: the v* tag points at it, so amending
          # it would leave the tag on a commit that never reaches the branch, and
          # `git describe` on the branch stops finding new release tags. No
          # [skip ci] needed: ci-cd.yml already skips its jobs for
          # `chore(release):` commits.
          npx commit-and-tag-version

      # Independent versioning tags every released project, so this run can create
      # several tags at once; both tools create annotated tags, which
      # `--follow-tags` pushes along with the commit. The commit and its tags land
      # together or not at all: a tag on a commit that never reached the branch
      # would stop `git describe` from finding newer release tags. No workflow
      # runs on a tag push, the release is created below.
      - name: Push the release commit and its tags
        id: push
        if: steps.branch.outputs.moved_on == 'false'
        env:
          BRANCH: ${{ github.ref }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          # commit-and-tag-version tags v<version.json>.
          release_tag="v$(node -p "require('./version.json').version")"
          echo "Release tag: $release_tag"

          if git push --atomic --follow-tags origin "HEAD:$BRANCH"; then
            echo "Pushed the release commit and its tags. Release: $release_tag" >> $GITHUB_STEP_SUMMARY
            echo "release_tag=$release_tag" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Rejected because the branch moved on since the check above: nothing
          # is released from this run. The newer commit's run picks up these
          # changes too, as ci-cd.yml counts the changes since the last release tag.
          tools/release/branch-moved-on.sh "$BRANCH" "$VALIDATED_SHA"

  # Builds the apps at the tag and publishes the GitHub release and the Sentry
  # release. Skipped when the version job stood down.
  release:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        name: 'Checkout the release tag'
        with:
          ref: ${{ needs.version.outputs.version }}
          fetch-depth: 0
          filter: tree:0

      - name: Install Deps
        uses: $/.github/actions/install-deps

      - name: Create release
        uses: $/.github/actions/create-release
        with:
          tag: ${{ needs.version.outputs.version }}
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

  # The Android deploy attaches its build to the GitHub release, so the deploy
  # waits for it.
  deploy:
    needs: [version, release]
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      issues: write

  issue-on-failure:
    needs: [version, release]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create Issue on Failure
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "bug(release): release pipeline failed" \
            --body "GitHub [Release workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) failed" \
            --label "bug" \
            --assignee "${{ github.actor }}"
