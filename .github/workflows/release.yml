name: Create release
on:
  push:
    # Pattern matched against refs/tags
    # Exclude deploy-marker tags pushed by deploy.yml (e.g. v1.2.3-cdk-deployed) so
    # they don't re-trigger this workflow and cascade into another release/deploy.
    tags:
      - 'v*'
      - '!v*-cdk-deployed'
      - '!v*-non-cdk-deployed'
      - '!v*-npm-deployed'
      - '!v*-android-deployed'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  issues: write
  contents: write

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  HUSKY: 0

jobs:
  release:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 50
          filter: tree:0

      - name: Install Deps
        uses: ./.github/actions/install-deps
        with:
          apt-packages: 'true'
          run-scripts: 'true'

      - name: create sentry release version
        id: sentry-version
        run: |
          SENTRY_VERSION="angular-examples@${{ github.ref_name }}"
          echo "Sentry version: ${SENTRY_VERSION}"
          echo "sentry-version=${SENTRY_VERSION}" >> $GITHUB_ENV

      - name: Build
        run: npx nx run-many -t="build" -c="production" --projects="tag:app"

      - name: ZIP-files for release
        uses: vimtor/action-zip@v1
        with:
          files: dist version.json
          recursive: false
          dest: release.zip

      # The release has to be created with a PAT (RELEASE_GH_TOKEN), not GITHUB_TOKEN:
      # events caused by GITHUB_TOKEN start no workflows, and deploy.yml runs on
      # `release: published`.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          api_error="$RUNNER_TEMP/release-lookup.err"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --silent 2> "$api_error"; then
            # A rerun after the release was published: refresh the asset only. The
            # deploy apps attach their own files to this release, and a redeploy
            # goes through deploy.yml's workflow_dispatch, not through a new
            # published event.
            gh release upload "$TAG" release.zip --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          elif ! grep -q "HTTP 404" "$api_error"; then
            cat "$api_error" >&2
            exit 1
          fi

          # The release notes are this version's section of CHANGELOG.md, which
          # commit-and-tag-version wrote in trigger-release.yml. Its version
          # headings are `## [x.y.z](...)`, older patch releases `### [x.y.z](...)`;
          # the type headings below them (`### Features`) carry no bracket.
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v version="${TAG#v}" '
            /^##+ \[/ { if (found) exit; found = index($0, "[" version "]") > 0; next }
            found { print }
          ' CHANGELOG.md > "$notes"

          if [[ -s "$notes" ]]; then
            notes_args=(--notes-file "$notes")
          else
            echo "CHANGELOG.md has no section for $TAG, using GitHub's generated notes."
            notes_args=(--generate-notes)
          fi

          gh release create "$TAG" release.zip \
            --title "$TAG" \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY" \
            "${notes_args[@]}"

      - name: Create Sentry Release
        uses: getsentry/action-release@v3
        with:
          release: ${{ env.sentry-version }}
          sourcemaps: 'dist/apps'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: 'wolsok'
          SENTRY_PROJECT: 'angular-examples'

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueTitle = 'bug(release): create release pipeline failed';
            const issueBody = 'GitHub [create release workflow](https://github.com/WolfSoko/wol-sok-mono/actions/workflows/release.yml) failed';
            const labels = ['bug'];
            const assignees = [context.actor];

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              assignees: assignees,
              labels: labels
            });
