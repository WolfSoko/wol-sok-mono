name: Release

# One pipeline per release: version bump, changelogs, tags and the GitHub
# release, then the deploy of everything that changed since the last deploy.
# ci-cd.yml calls it after a green run on main. Run it by hand to release now,
# or with `tag` to refresh the GitHub release of an existing tag (notes and
# asset) and deploy it again.
on:
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
        description: 'Refresh the GitHub release of this existing tag (v<version>) instead of versioning, then deploy it'
    outputs:
      version:
        description: 'The released tag (v<version>)'
        value: ${{ jobs.release.outputs.version }}
  workflow_dispatch:
    inputs:
      tag:
        required: false
        type: string
        description: 'Refresh the GitHub release of this existing tag (v<version>) instead of versioning, then deploy it'

env:
  HUSKY: 0
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    # Versioning, the production build of every app and the release.
    timeout-minutes: 45
    permissions:
      contents: write
    # One release at a time: the version bump commits to main.
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # The commit CI just validated, not the branch tip, which may have moved on
      # by now. The PAT pushes the release commit to the protected main branch.
      - uses: actions/checkout@v7
        name: 'Checkout the validated commit'
        with:
          ref: ${{ inputs.tag || github.sha }}
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
          filter: tree:0

      - name: Install Deps
        uses: $/.github/actions/install-deps

      - name: Snapshot tags before versioning
        if: ${{ !inputs.tag }}
        run: git tag --list | LC_ALL=C sort > "$RUNNER_TEMP/tags-before.txt"

      - name: Version
        if: ${{ !inputs.tag }}
        run: |
          git config --local user.email "github-actions[bot]@users.no-reply.github.com"
          git config --local user.name "github-actions[bot]"
          npx nx release version
          # Leave the release commit as it is: the v* tag points at it, so amending
          # it would leave the tag on a commit that never reaches the branch, and
          # `git describe` on the branch stops finding new release tags. No
          # [skip ci] needed: ci-cd.yml already skips its jobs for
          # `chore(release):` commits.
          npx commit-and-tag-version

      # Independent versioning tags every released project, so this run can create
      # several tags at once. The commit and its tags land together or not at
      # all: a tag on a commit that never reached the branch would stop
      # `git describe` from finding newer release tags. No workflow runs on a tag
      # push, the release is created below.
      - name: Push the release commit and its tags
        id: push
        if: ${{ !inputs.tag }}
        env:
          BRANCH: ${{ github.ref }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          git tag --list | LC_ALL=C sort > "$RUNNER_TEMP/tags-after.txt"
          mapfile -t new_tags < <(comm -13 "$RUNNER_TEMP/tags-before.txt" "$RUNNER_TEMP/tags-after.txt")

          release_tags=()
          for tag in "${new_tags[@]}"; do
            if [[ "$tag" == v[0-9]* ]]; then
              release_tags+=("$tag")
            fi
          done
          echo "New tags: ${new_tags[*]:-none}"
          echo "Release tag: ${release_tags[*]:-none}"

          if git push --atomic origin "HEAD:$BRANCH" "${new_tags[@]}"; then
            echo "Pushed the release commit and ${#new_tags[@]} new tag(s)." >> $GITHUB_STEP_SUMMARY
            echo "release_tag=${release_tags[*]: -1}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Rejected because the branch moved on while CI ran: nothing is released
          # from this run. The newer commit's run picks up these changes too, as
          # ci-cd.yml counts the changes since the last release tag.
          git fetch origin "$BRANCH"
          if [[ "$(git rev-parse FETCH_HEAD)" != "$VALIDATED_SHA" ]]; then
            echo "::notice::$BRANCH moved on since this run started, the run for its newest commit releases instead."
            echo "No release: \`$BRANCH\` moved on since this run started, the run for its newest commit releases instead." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          exit 1

      - name: Released version
        id: version
        env:
          VERSION: ${{ inputs.tag || steps.push.outputs.release_tag }}
        run: |
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ -n "$VERSION" ]]; then
            echo "Release: $VERSION" >> $GITHUB_STEP_SUMMARY
          fi

      # HEAD is the release commit the tag points at, so the apps are built here.
      - name: Create release
        if: steps.version.outputs.version != ''
        uses: $/.github/actions/create-release
        with:
          tag: ${{ steps.version.outputs.version }}
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Create Issue on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh issue create \
            --title "bug(release): release pipeline failed" \
            --body "GitHub [Release workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) failed" \
            --label "bug" \
            --assignee "${{ github.actor }}"

  deploy:
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      issues: write
