name: Create release (manual)

# The release of a version is normally created by the trigger-release job of
# ci-cd.yml right after it pushed the tag, on the same runner. This workflow
# recreates the GitHub release (or refreshes its asset) for a tag that already
# exists, for when that step failed.
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        default: v74.52.2
        description: Release tag (v<version>)

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: true

permissions:
  issues: write
  contents: write

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  HUSKY: 0

jobs:
  release:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 50
          filter: tree:0

      - name: Install Deps
        uses: ./.github/actions/install-deps

      - name: Create release
        uses: ./.github/actions/create-release
        with:
          tag: ${{ inputs.tag }}
          github-token: ${{ secrets.RELEASE_GH_TOKEN }}
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
