name: CI/CD
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/version.json'
      - '**/CHANGELOG.md'
    tags-ignore:
      - 'v*'
      - '*@*'
  pull_request:
  # Pflicht fuer die Merge Queue: GitHub baut den Stapel aus main + den
  # eingereihten PRs auf einem eigenen Branch und wartet auf genau die Checks,
  # die das Ruleset verlangt. Ohne diesen Ausloeser laeuft dort kein Workflow,
  # der Check "main" wird nie gemeldet, und jeder PR haengt in der Schlange
  # fest statt zu mergen.
  merge_group:

# One run per PR, the newest wins. On main (and in the merge queue) every
# commit gets its own run, so a release (part of the run) never holds up the
# checks of the next commit; the version job serializes itself (release.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') || startsWith(github.ref_name, 'renovate-github-sh') }}

# Needed for nx-set-shas when run on the main branch
permissions:
  actions: read
  contents: write
  pull-requests: write

env:
  HUSKY: 0
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  NODE_OPTIONS: '--max_old_space_size=4096'
  NX_VERBOSE_LOGGING: true

jobs:
  main:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') && !contains(github.event.head_commit.message || '', 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      shouldTriggerRelease: ${{ steps.shouldTriggerRelease.outputs.triggerRelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Debug print env variables
        run: |
          printenv

      - name: install deps
        uses: $/.github/actions/install-deps

      # This line is needed for nx affected to work when CI is running on a PR
      - run: git branch --track main origin/main
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'

      - uses: nrwl/nx-set-shas@v5
      - run: |
          echo "BASE: ${{ env.NX_BASE }}"
          echo "HEAD: ${{ env.NX_HEAD }}"

      # Starts the Nx Cloud workers (.nx/ci-config.yaml, .nx/workflows/workers.yml).
      # After the install on purpose: run through npx before node_modules exist, the
      # command cannot resolve the nx package and requests no workers (the run then
      # waits forever), and here NX_BASE/NX_HEAD are forwarded to the workers too.
      - run: npx nx-cloud start-workers

      - name: Format check
        run: npx nx format:check

      - name: Sync check
        run: npx nx sync:check

      - name: run-checks in parallel on nx cloud workers
        run: |
          npx nx affected -t="lint,lint-templates,test,build,e2e-ci" -c=ci

      - name: Auto Fix CI
        if: always()
        run: npx nx fix-ci

      - name: Report Codecov
        if: success() && github.ref_name == 'main' && hashFiles('coverage/**/*') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: true
          verbose: true
      # Counted since the last release tag, not since the last run: a run whose
      # release stood down because main had moved on (release.yml) leaves its
      # changes to the next run, which must see them. On main the last release
      # tag is v<version.json>: the release commit bumps the file and gets the
      # tag in the same push.
      - name: determine if deployables or published packages are affected and a release should be triggered
        if: success() && github.ref_name == 'main'
        id: shouldTriggerRelease
        run: |
          last_release="v$(node -p "require('./version.json').version")"
          echo "Last release: $last_release"
          # What deploy.yml deploys: every project with a deploy target, plus the published packages.
          projects=$(
            npx nx show projects --affected --base="$last_release" --head="$NX_HEAD" --withTarget deploy
            npx nx show projects --affected --base="$last_release" --head="$NX_HEAD" --projects='tag:published'
          )
          echo "Affected releasable projects: $projects"
          if [[ -z "$projects" ]]; then
            echo "triggerRelease=false" >> $GITHUB_OUTPUT
            echo 'No deployable projects or published packages affected, no need for a release' >> $GITHUB_STEP_SUMMARY
          else
            echo "triggerRelease=true" >> $GITHUB_OUTPUT
            echo 'Deployable projects or published packages affected. Trigger release!!!' >> $GITHUB_STEP_SUMMARY
          fi
  # A separate job, as the main job is the check the branch protection requires.
  # Versions, creates the GitHub release and deploys, all in this run.
  release:
    uses: ./.github/workflows/release.yml
    secrets: inherit
    needs: main
    permissions:
      contents: write
      id-token: write
      issues: write
    if: ${{ success() && needs.main.outputs.shouldTriggerRelease == 'true' && !contains(github.event.head_commit.message, 'chore(release):') && github.ref_name == 'main' }}
