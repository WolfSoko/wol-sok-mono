name: Deploy release

# Deploys what changed since the last deploy of each kind, at the given release
# tag. release.yml calls it right after creating the release; run it by hand to
# redeploy a version.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: Release tag (v<version>)

  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        default: v74.52.2
        description: Release tag (v<version>)

permissions:
  issues: write
  contents: write
  id-token: write # needed for npm provenance

env:
  HUSKY: 0
  RELEASE_VERSION: ${{ inputs.version }}
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

jobs:
  deploy:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    environment: aws-cdk
    # One deploy per kind at a time, whatever the version: a later version waits
    # for the running one instead of racing it or cutting it off halfway.
    concurrency:
      group: deploy-${{ matrix.config.app-type }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        config:
          - app-type: npm-packages
            deploy-tag-suffix: npm-deployed
            projects-filter: 'tag:published'
            extra-deploy-args: ''
          - app-type: non-cdk
            deploy-tag-suffix: non-cdk-deployed
            exclude-pattern: 'tag:cdk,tag:published,tag:type:android'
            extra-deploy-args: ''
          - app-type: android
            deploy-tag-suffix: android-deployed
            exclude-pattern: '*,!tag:type:android'
            extra-deploy-args: ''
          - app-type: cdk
            deploy-tag-suffix: cdk-deployed
            exclude-pattern: '*,!tag:cdk'
            extra-deploy-args: ''
    steps:
      - run: echo "Release process starting for ${{ matrix.config.app-type }} apps version ${{ env.RELEASE_VERSION }}"

      - uses: actions/checkout@v7
        name: 'Checkout version tagged branch'
        with:
          ref: ${{ env.RELEASE_VERSION }}
          fetch-depth: 0
          fetch-tags: true
          filter: tree:0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install Deps
        uses: $/.github/actions/install-deps

      # OIDC trusted publishing needs npm 11.5.1 or newer, which Node 24 bundles.
      - name: Setup Node.js for npm publishing
        if: matrix.config.app-type == 'npm-packages'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org/'

      # The runner image has the Android SDK; Gradle needs a JDK on top.
      - name: Setup Java for the Android app
        if: matrix.config.app-type == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Restores the Gradle distribution and dependencies the Android app
      # workflow saved on main. Read-only: a run on a tag could not save a cache
      # that later tag runs could read.
      - name: Restore the Gradle cache for the Android app
        if: matrix.config.app-type == 'android'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Find previous deployment tag
        id: previous_deployment
        run: |
          echo "Determining SHAs for affected projects"
          if PREVIOUS_DEPLOYMENT=$(git describe --tags --abbrev=0 --match="*-${{ matrix.config.deploy-tag-suffix }}" 2>/dev/null); then
            echo "Previous release: $PREVIOUS_DEPLOYMENT"
            echo "NX_BASE=$PREVIOUS_DEPLOYMENT" >> $GITHUB_ENV
          else
            echo "No previous '*-${{ matrix.config.deploy-tag-suffix }}' tag found - treating as initial deployment (all projects affected)."
            echo "NX_BASE=$(git hash-object -t tree /dev/null)" >> $GITHUB_ENV
          fi
          echo "NX_HEAD=$RELEASE_VERSION" >> $GITHUB_ENV

      - name: Show affected projects and set triggerRelease
        run: |
          set_trigger_release() {
            local affected="$1"
            if [[ -z "$affected" ]]; then
              echo "triggerRelease=false" >> $GITHUB_ENV
              echo "Trigger release: false for ${affected}"
              echo "$2" >> $GITHUB_STEP_SUMMARY
            else
              echo "triggerRelease=true" >> $GITHUB_ENV
              echo "Trigger release: true for ${affected}"
              echo "$3" >> $GITHUB_STEP_SUMMARY
            fi
          }

          if [[ "${{ matrix.config.app-type }}" == "npm-packages" ]]; then
            AFFECTED_PROJECTS=$(npx nx show projects --affected --projects='tag:published')
            set_trigger_release "$AFFECTED_PROJECTS" \
              "No npm packages affected." \
              "NPM packages affected. Start publishing!!!"
          else
            AFFECTED_PROJECTS=$(npx nx show projects --affected -t deploy --exclude='${{ matrix.config.exclude-pattern }}')
            set_trigger_release "$AFFECTED_PROJECTS" \
              "No deployable projects affected." \
              "Deployable projects affected. Start deployment!!!"
          fi

      - name: Build npm packages
        if: success() && env.triggerRelease == 'true' && matrix.config.app-type == 'npm-packages'
        run: npx nx run-many -t build --projects='${{ matrix.config.projects-filter }}'

      - name: Publish npm packages
        if: success() && env.triggerRelease == 'true' && matrix.config.app-type == 'npm-packages'
        run: npx nx release publish

      - name: Deploy Apps
        if: success() && env.triggerRelease == 'true' && matrix.config.app-type != 'npm-packages'
        run: npx nx affected --target=deploy --exclude='${{ matrix.config.exclude-pattern }}' ${{ matrix.config.extra-deploy-args}}
        env:
          # The upload key and the Play account only reach the Android leg.
          ANDROID_KEYSTORE_BASE64: ${{ matrix.config.app-type == 'android' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ matrix.config.app-type == 'android' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ matrix.config.app-type == 'android' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ matrix.config.app-type == 'android' && secrets.ANDROID_KEY_PASSWORD || '' }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ matrix.config.app-type == 'android' && secrets.PLAY_SERVICE_ACCOUNT_JSON || '' }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ matrix.config.app-type == 'android' && secrets.YOUTUBE_OAUTH_CLIENT_ID || '' }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ matrix.config.app-type == 'android' && secrets.YOUTUBE_OAUTH_CLIENT_SECRET || '' }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ matrix.config.app-type == 'android' && secrets.YOUTUBE_OAUTH_REFRESH_TOKEN || '' }}

      - name: Tag deployment success
        if: success() && env.triggerRelease == 'true'
        run: |
          echo "Configuring git user"
          git config --global user.email "github-actions[bot]@users.no-reply.github.com"
          git config --global user.name "github-actions[bot]"

          echo "Setting deploy tag"
          DEPLOY_TAG=$RELEASE_VERSION-${{ matrix.config.deploy-tag-suffix }}
          echo "Deploy tag: $DEPLOY_TAG"

          # The commit the release tag points at: called from release.yml, this run
          # started on the commit before the release commit, so GITHUB_SHA is not it.
          echo "Tagging the release commit"
          git tag -a "$DEPLOY_TAG" "$RELEASE_VERSION^{commit}" -m "Version $RELEASE_VERSION deployed ${{ matrix.config.app-type }} apps successfully"

          echo "Pushing tags"
          git push origin "$DEPLOY_TAG"

      - name: Create Issue
        if: failure()
        run: |
          gh issue create \
            --title "bug(deploy): Deploy release ${{ env.RELEASE_VERSION }} for ${{ matrix.config.app-type }} apps failed" \
            --body "GitHub [Deploy release workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            --label "bug" \
            --assignee "${{ github.actor }}"
