name: 'Create release'
description: 'Builds the apps at the checked-out release tag, publishes the GitHub release with the build as asset and creates the Sentry releases'
inputs:
  tag:
    description: 'The release tag (v<version>), checked out already'
    required: true
  sentry-auth-token:
    description: 'Auth token of the Sentry org'
    required: true

runs:
  using: composite

  steps:
    - name: Build
      shell: bash
      run: npx nx run-many -t="build" -c="production" --projects="tag:app"

    - name: ZIP-files for release
      uses: vimtor/action-zip@v1
      with:
        files: dist version.json
        recursive: false
        dest: release.zip

    - name: Create GitHub release
      shell: bash
      env:
        # GITHUB_TOKEN is enough: nothing runs on the release event any more,
        # release.yml deploys in the same run.
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
      run: |
        # The release notes are this version's section of CHANGELOG.md, which
        # commit-and-tag-version wrote in release.yml. Its version
        # headings are `## [x.y.z](...)`, older patch releases `### [x.y.z](...)`;
        # the type headings below them (`### Features`) carry no bracket.
        notes="$RUNNER_TEMP/release-notes.md"
        awk -v version="${TAG#v}" '
          /^##+ \[/ { if (found) exit; found = index($0, "[" version "]") > 0; next }
          found { print }
        ' CHANGELOG.md > "$notes"

        if [[ -s "$notes" ]]; then
          notes_args=(--notes-file "$notes")
        else
          echo "CHANGELOG.md has no section for $TAG, using GitHub's generated notes."
          notes_args=(--generate-notes)
        fi

        # A rerun refreshes the notes and the asset of the published release;
        # the deploy apps attach their own files to it, those stay. A new release
        # is created without the asset: with files, gh first creates a draft,
        # uploads, then publishes, and a failed upload leaves a draft behind that
        # the tag lookup cannot see. Created this way the release is published at
        # once and a failed upload is retried on the rerun.
        api_error="$RUNNER_TEMP/release-lookup.err"
        if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --silent 2> "$api_error"; then
          if [[ -s "$notes" ]]; then
            gh release edit "$TAG" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
          fi
        elif grep -q "HTTP 404" "$api_error"; then
          gh release create "$TAG" \
            --title "$TAG" \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY" \
            "${notes_args[@]}"
        else
          cat "$api_error" >&2
          exit 1
        fi
        gh release upload "$TAG" release.zip --clobber --repo "$GITHUB_REPOSITORY"

    - name: Create Sentry Release
      uses: getsentry/action-release@v3
      with:
        release: angular-examples@${{ inputs.tag }}
        sourcemaps: 'dist/apps'
      env:
        SENTRY_AUTH_TOKEN: ${{ inputs.sentry-auth-token }}
        SENTRY_ORG: 'wolsok'
        SENTRY_PROJECT: 'angular-examples'

    # Bacteria Wars reports to two projects of its own, the game on its own
    # site and its Cloud Functions, both as `bacteria-wars@<tag>` (the game's
    # environment.prod.ts and the functions' error-reports.ts build the same
    # name from version.json). The game's source maps are served with it
    # already (`hidden: false`), so uploading them shows nothing new; the
    # functions' bundle has none and is not minified.
    - name: Create Sentry Release for Bacteria Wars
      uses: getsentry/action-release@v3
      with:
        release: bacteria-wars@${{ inputs.tag }}
        projects: 'bacteria-wars bacteria-wars-functions'
        sourcemaps: 'dist/apps/bacteria-game-remote'
        # The first release of the two projects has no previous one.
        ignore_missing: true
      env:
        SENTRY_AUTH_TOKEN: ${{ inputs.sentry-auth-token }}
        SENTRY_ORG: 'wolsok'
